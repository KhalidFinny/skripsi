# Tuning Optuna untuk protokol LOSO (project-owned).
#
# Beda dari exp/tabr/convat_apex_anxiety/0-tuning.toml:
#   - data = dataset LOSO (subjek-disjoint, val 11 subjek), bukan split 60/20/20
#   - space dilebarkan: lr tidak lagi boleh mentok di 3e-5, dropout tidak lagi
#     mentok di 0.6, patience sampai 40 (dulu maksimum 6 -> berhenti sebelum belajar)
#
# Metrik pemilihan TIDAK diubah: TabR default binclass = "accuracy", sama seperti
# protokol asli. Yang berubah cuma protokol (LOSO) dan fitur (ROI25). AUC sudah
# dihapus dari pipeline (bukan bagian protokol asli).
#
# Cara pakai (data fold harus sudah di-stage dulu oleh run_loso.py):
#   1) ./run loso --fold 0 --seeds 1        # stage data fold 0, selesai 1 fold
#   2) PROJECT_DIR=$PWD/third_party/tabular-dl-tabr-official \
#        .venv/bin/python third_party/tabular-dl-tabr-official/bin/tune.py \
#        experiments/configs/tabr_loso_roi25_tuning.toml
#   3) salin hyperparameter terbaik dari 0-tuning/... ke
#      experiments/configs/tabr_loso_roi25.toml, lalu jalankan LOSO penuh.
#
# Catatan: 1 trial = 1 fold training (epoch berhenti di patience). 30 trial
# kira-kira 1-3 jam di GTX 1650 Ti.

seed = 72
function = "bin.tabr.main"
n_trials = 30
timeout = "__null__"

[sampler]

[space]
seed = 72
batch_size = 128
patience = [
    "_tune_",
    "int",
    10,
    40,
]
n_epochs = inf
context_size = [
    "_tune_",
    "int",
    7,
    24,
]

[space.data]
seed = 72
cache = false
path = ":data/convat_apex_anxiety_loso_roi25"
num_policy = "standard"
cat_policy = "__null__"
y_policy = "__null__"

[space.model]
num_embeddings = "__null__"
d_main = [
    "_tune_",
    "int",
    96,
    384,
]
context_dropout = [
    "_tune_",
    "uniform",
    0.0,
    0.5,
]
d_multiplier = 2.0
encoder_n_blocks = 0
predictor_n_blocks = [
    "_tune_",
    "int",
    1,
    3,
]
mixer_normalization = "auto"
dropout0 = [
    "_tune_",
    "uniform",
    0.0,
    0.5,
]
dropout1 = [
    "_tune_",
    "uniform",
    0.0,
    0.4,
]
normalization = "LayerNorm"
activation = "ReLU"

[space.optimizer]
type = "AdamW"
lr = [
    "_tune_",
    "loguniform",
    1e-04,
    0.005,
]
weight_decay = [
    "_tune_",
    "loguniform",
    1e-06,
    1e-03,
]
